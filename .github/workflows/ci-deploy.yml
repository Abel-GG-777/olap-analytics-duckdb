name: Verify OLAP and browser build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Build production image
        run: docker build -t olap:test .
      - name: Verify production container
        run: |
          docker run -d --name olap -p 8080:8080 olap:test
          trap 'docker logs olap; docker rm -f olap' EXIT
          python scripts/smoke.py http://localhost:8080

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: dist
