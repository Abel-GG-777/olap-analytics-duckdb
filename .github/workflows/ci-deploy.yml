name: Verify and deploy OLAP
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest -q
      - run: node --check app/static/app.js
      - name: Build production image
        run: docker build -t olap:test .
      - name: Verify production container
        run: |
          docker run -d --name olap -p 8080:8080 olap:test
          trap 'docker logs olap; docker rm -f olap' EXIT
          python scripts/smoke.py http://localhost:8080

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy to Google Cloud Run
        id: deploy
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          BUILD_SA: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          gcloud run deploy olap-analytics-duckdb --source . \
            --project "$PROJECT" --region "$REGION" --quiet \
            --build-service-account "$BUILD_SA" --service-account "$RUNTIME_SA" \
            --allow-unauthenticated --memory 1Gi --cpu 1 \
            --min-instances 0 --max-instances 2 --concurrency 8 --timeout 60 \
            --labels "commit=${GITHUB_SHA}"
          URL=$(gcloud run services describe olap-analytics-duckdb --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke test deployed service
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          python scripts/smoke.py "$APP_URL"
          echo "Verified deployment: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
